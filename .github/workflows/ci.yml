name: Python quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend source
        run: python -m compileall -q backend/app
      - name: Run unit tests
        run: python -m unittest discover -s backend/tests